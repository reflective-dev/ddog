services:
  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    container_name: ddog-agent
    pid: host
    environment:
      DD_API_KEY: ${DD_API_KEY:?set DD_API_KEY in .env}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_HOSTNAME: ddog-local
      DD_TAGS: env:development service:ddog

      # Accept DogStatsD metrics from the BFF running on the host.
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: 'true'
      DD_USE_DOGSTATSD: 'true'
      # Enables `agent dogstatsd-stats`, which shows per-metric receive counts —
      # the quickest way to confirm a metric actually reached the agent.
      DD_DOGSTATSD_METRICS_STATS_ENABLE: 'true'

      # APM traces from dd-trace.
      DD_APM_ENABLED: 'true'
      DD_APM_NON_LOCAL_TRAFFIC: 'true'

      DD_LOGS_ENABLED: 'true'
    ports:
      - '8125:8125/udp' # DogStatsD
      - '8126:8126/tcp' # APM traces
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
